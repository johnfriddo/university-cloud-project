<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" color="#000000" style="background:#ffffff" role="img"
       aria-label="Architettura del deployment locale: il browser carica il file direttamente sull'object storage attraverso l'ingresso, mentre l'api-service si limita a firmare il permesso e a pubblicare il job in coda.">
    <defs>
      <marker id="p" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
      </marker>
      <marker id="pf" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#0b5cd5"/>
      </marker>
    </defs>

    <g fill="none" stroke="currentColor" stroke-width="1.5">
      <!-- confine del cluster -->
      <rect x="270" y="18" width="1150" height="800" stroke-dasharray="7 6" stroke-width="1.5"/>
    </g>
    <text x="284" y="11" font-size="13" font-weight="600" fill="currentColor">Cluster Kubernetes — 3 VM con Multipass (1 control-plane + 2 worker)</text>

    <!-- ===== caselle ===== -->
    <g fill="none" stroke="currentColor" stroke-width="1.6">
      <rect x="26"   y="130" width="210" height="84"/>
      <rect x="310"  y="130" width="200" height="84"/>
      <rect x="580"  y="130" width="180" height="84"/>
      <rect x="830"  y="130" width="190" height="84"/>
      <rect x="1090" y="130" width="210" height="84"/>
      <rect x="1090" y="34"  width="210" height="54"/>
      <rect x="310"  y="300" width="160" height="76"/>
      <rect x="830"  y="300" width="190" height="76"/>
      <rect x="300"  y="570" width="170" height="100"/>
      <rect x="580"  y="570" width="180" height="100"/>
      <rect x="830"  y="570" width="190" height="100"/>
      <rect x="1090" y="570" width="210" height="100"/>
    </g>

    <g fill="currentColor" text-anchor="middle">
      <text x="131"  y="164" font-size="14" font-weight="600">Utente / Browser</text>
      <text x="131"  y="185" font-size="12">Carica e scarica</text>
      <text x="131"  y="202" font-size="12">le immagini</text>

      <text x="410"  y="160" font-size="14" font-weight="600">Ingress NGINX</text>
      <text x="410"  y="180" font-size="12">Punto d'ingresso</text>
      <text x="410"  y="197" font-size="12">Instrada 4 rotte</text>

      <text x="670"  y="164" font-size="14" font-weight="600">api-service</text>
      <text x="670"  y="185" font-size="12">Python, Flask</text>
      <text x="670"  y="202" font-size="12">Firma i permessi</text>

      <text x="925"  y="164" font-size="14" font-weight="600">RabbitMQ</text>
      <text x="925"  y="185" font-size="12">Coda dei job</text>
      <text x="925"  y="202" font-size="12">Eventi di fine</text>

      <text x="1195" y="160" font-size="14" font-weight="600">worker-service × N</text>
      <text x="1195" y="180" font-size="12">Python (Pillow)</text>
      <text x="1195" y="197" font-size="12">Genera le varianti</text>

      <text x="1195" y="56"  font-size="13" font-weight="600">KEDA</text>
      <text x="1195" y="76"  font-size="12">Autoscaler a eventi</text>

      <text x="390"  y="332" font-size="14" font-weight="600">frontend</text>
      <text x="390"  y="353" font-size="12">Angular, Nginx</text>

      <text x="925"  y="326" font-size="14" font-weight="600">notification-service</text>
      <text x="925"  y="346" font-size="12">Registra e consegna</text>
      <text x="925"  y="363" font-size="12">gli avvisi</text>

      <text x="385"  y="614" font-size="13" font-weight="600">ConfigMap</text>
      <text x="385"  y="634" font-size="13" font-weight="600">e Secret</text>

      <text x="670"  y="606" font-size="14" font-weight="600">PostgreSQL</text>
      <text x="670"  y="626" font-size="12">Utenti, immagini,</text>
      <text x="670"  y="643" font-size="12">varianti, avvisi,</text>
      <text x="670"  y="660" font-size="12">stato del job</text>

      <text x="925"  y="614" font-size="14" font-weight="600">MongoDB</text>
      <text x="925"  y="634" font-size="12">Dati tecnici EXIF</text>
      <text x="925"  y="651" font-size="12">Schema variabile</text>

      <text x="1195" y="614" font-size="14" font-weight="600">Object Storage MinIO</text>
      <text x="1195" y="634" font-size="12">Originali e varianti</text>
      <text x="1195" y="651" font-size="12">Link firmati</text>
    </g>

    <!-- ===== frecce in nero ===== -->
    <g fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#p)">
      <line x1="236" y1="152" x2="302" y2="152"/>
      <line x1="510" y1="152" x2="572" y2="152"/>
      <line x1="390" y1="214" x2="390" y2="294"/>
      <line x1="760" y1="152" x2="822" y2="152"/>
      <line x1="1020" y1="148" x2="1082" y2="148"/>
      <line x1="1084" y1="196" x2="1022" y2="196"/>
      <line x1="925" y1="214" x2="925" y2="294"/>
      <line x1="630" y1="214" x2="630" y2="564"/>
      <line x1="1240" y1="214" x2="1240" y2="564"/>
      <line x1="1195" y1="88"  x2="1195" y2="124"/>
      <polyline points="710,214 710,520 880,520 880,564"/>
      <polyline points="860,376 860,545 690,545 690,564"/>
      <polyline points="1150,214 1150,495 950,495 950,564"/>
      <polyline points="1110,214 1110,470 740,470 740,564"/>
      <polyline points="1090,60 925,60 925,124"/>
    </g>

    <!-- ===== il percorso del file, in blu ===== -->
    <g fill="none" stroke="#0b5cd5" stroke-width="2.4" marker-end="url(#pf)">
      <line x1="236" y1="190" x2="302" y2="190"/>
      <polyline points="490,214 490,740 1195,740 1195,676"/>
    </g>

    <!-- ===== etichette delle frecce ===== -->
    <!-- Le etichette hanno un alone bianco: molte cadono su una linea, e senza
         l'alone il testo diventa illeggibile proprio dove serve. -->
    <g fill="currentColor" font-size="11" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">
      <text x="269" y="140" text-anchor="middle">1 · richiesta</text>
      <text x="541" y="140" text-anchor="middle">2 · /api</text>
      <text x="398" y="262" text-anchor="start">serve la pagina  /</text>
      <text x="791" y="140" text-anchor="middle">4 · pubblica</text>
      <text x="1051" y="136" text-anchor="middle">5 · consuma</text>
      <text x="1051" y="218" text-anchor="middle">6 · evento</text>
      <text x="933" y="262" text-anchor="start">7 · avvisa</text>
      <text x="638" y="300" text-anchor="start">3 · registra l'immagine</text>
      <text x="718" y="440" text-anchor="start">legge i metadati</text>
      <text x="868" y="420" text-anchor="start">legge e scrive</text>
      <text x="868" y="436" text-anchor="start">gli avvisi</text>
      <text x="1158" y="300" text-anchor="start">scrive i dati EXIF</text>
      <text x="1118" y="260" text-anchor="start">aggiorna lo stato</text>
      <text x="1248" y="300" text-anchor="start">legge l'originale,</text>
      <text x="1248" y="316" text-anchor="start">scrive le varianti</text>
      <text x="1082" y="50" text-anchor="end">legge la lunghezza della coda</text>
      <text x="1203" y="112" text-anchor="start">quante repliche</text>
    </g>
    <g fill="#0b5cd5" font-size="11" font-weight="600" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">
      <text x="269" y="184" text-anchor="middle">il file</text>
      <text x="500" y="300" text-anchor="start">/originals</text>
      <text x="500" y="316" text-anchor="start">/derived</text>
      <text x="745" y="732" text-anchor="middle" font-size="12">il file viaggia dal browser all'archivio senza passare dall'api-service</text>
    </g>
  </svg>
