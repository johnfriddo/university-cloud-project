[project]
name = "media-common"
version = "0.1.0"
description = "Adapter condivisi verso object storage e message broker"
requires-python = ">=3.12"
# Owned here, not by the services: whoever installs the adapters gets exactly
# the client libraries they were written against.
dependencies = [
    "boto3~=1.35",
    "pika~=1.3",
]

# Optional: only the services that read or write the technical metadata install
# the MongoDB driver, with pip install "media-common[mongo]".
[project.optional-dependencies]
mongo = ["pymongo~=4.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["media_common*"]
