{{/*
Le credenziali, e gli indirizzi di connessione che le contengono.

Nessun valore predefinito: se una manca il chart si ferma qui, con il nome
della credenziale mancante, invece di installare un sistema con la password
scritta nel chart.

In locale i valori arrivano da deploy/helm/values.local.yaml, che git ignora e
che `deploy/cluster/app.sh secrets` genera con valori casuali. Su AWS li legge
Terraform da Secrets Manager e li passa qui (deploy/terraform/aws/app).

Nota: un Secret di Kubernetes è codificato in base64, non cifrato. Chi può
leggere il namespace può leggerlo. Su EKS il modulo di Terraform cifra i
Secret con una chiave KMS prima di scriverli sul disco del piano di controllo.
*/}}
{{- $local := eq .Values.platform "local" }}
{{- $required := dict
    "postgresUser" "utente PostgreSQL"
    "postgresPassword" "password PostgreSQL"
    "rabbitmqUser" "utente RabbitMQ"
    "rabbitmqPassword" "password RabbitMQ"
    "jwtSecret" "chiave di firma dei token" -}}
{{- if $local }}
  {{- $_ := set $required "mongoUser" "utente MongoDB" }}
  {{- $_ := set $required "mongoPassword" "password MongoDB" }}
  {{- $_ := set $required "minioRootUser" "utente MinIO" }}
  {{- $_ := set $required "minioRootPassword" "password MinIO" }}
{{- else }}
  {{- range $key, $description := dict "postgresHost" "indirizzo di RDS" "rabbitmqHost" "indirizzo di Amazon MQ" }}
    {{- if not (get $.Values.aws $key) }}
      {{- fail (printf "manca aws.%s (%s): su AWS questi valori li scrive Terraform" $key $description) }}
    {{- end }}
  {{- end }}
{{- end }}
{{- range $key, $description := $required }}
  {{- if not (get $.Values.secrets $key) }}
    {{- fail (printf "manca secrets.%s (%s): genera le credenziali con `deploy/cluster/app.sh secrets`" $key $description) }}
  {{- end }}
{{- end }}
{{- if lt (len .Values.secrets.jwtSecret) 32 }}
  {{- fail "secrets.jwtSecret deve avere almeno 32 caratteri: sotto quella lunghezza una firma HMAC-SHA256 è considerata debole (RFC 7518)" }}
{{- end }}
{{- $pg := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    {{- include "media-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
{{- if $local }}
  # Le credenziali così come le vogliono le immagini degli archivi dati.
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.app.postgresDatabase | quote }}
  MONGO_USER: {{ .Values.secrets.mongoUser | quote }}
  MONGO_PASSWORD: {{ .Values.secrets.mongoPassword | quote }}
  RABBITMQ_USER: {{ .Values.secrets.rabbitmqUser | quote }}
  RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmqPassword | quote }}
  MINIO_ROOT_USER: {{ .Values.secrets.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | quote }}

  # Gli indirizzi completi che i servizi si aspettano. Composti qui, in un
  # punto solo: sono la stessa riga che in docker-compose.yml sta nel blocco
  # &app-env, e contengono una password, quindi vivono nel Secret e non nella
  # ConfigMap.
  DATABASE_URL: "postgresql://{{ $pg.postgresUser }}:{{ $pg.postgresPassword }}@postgres:5432/{{ .Values.app.postgresDatabase }}"
  # authSource=admin: l'utente è stato creato nel database di amministrazione,
  # non in quello applicativo, ed è lì che va cercato.
  MONGO_URL: "mongodb://{{ .Values.secrets.mongoUser }}:{{ .Values.secrets.mongoPassword }}@mongo:27017/{{ .Values.app.mongoDatabase }}?authSource=admin"
  RABBITMQ_URL: "amqp://{{ $pg.rabbitmqUser }}:{{ $pg.rabbitmqPassword }}@rabbitmq:5672/"

  # Lo stesso indirizzo, scritto per intero. Serve a KEDA, che vive in un
  # namespace suo: là il nome breve `rabbitmq` non significa niente, perché la
  # scorciatoia vale solo dentro il namespace che ospita il servizio. Chi
  # guarda la coda da fuori deve chiamarla per nome e cognome.
  RABBITMQ_URL_FQDN: "amqp://{{ $pg.rabbitmqUser }}:{{ $pg.rabbitmqPassword }}@rabbitmq.{{ .Release.Namespace }}.svc.cluster.local:5672/"

  # Le stesse credenziali di MinIO, con i nomi che usa il codice applicativo.
  S3_ACCESS_KEY: {{ .Values.secrets.minioRootUser | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.minioRootPassword | quote }}
{{- else }}
  # RDS: sslmode=require perché PostgreSQL su RDS, dalla versione 15, rifiuta
  # le connessioni in chiaro. Dirlo qui trasforma un rifiuto misterioso in una
  # scelta scritta.
  DATABASE_URL: "postgresql://{{ $pg.postgresUser }}:{{ $pg.postgresPassword }}@{{ .Values.aws.postgresHost }}:5432/{{ .Values.app.postgresDatabase }}?sslmode=require"
  # Amazon MQ accetta solo AMQP su TLS: amqps, porta 5671. Il certificato del
  # broker viene verificato davvero, nome dell'host compreso.
  RABBITMQ_URL: "amqps://{{ $pg.rabbitmqUser }}:{{ $pg.rabbitmqPassword }}@{{ .Values.aws.rabbitmqHost }}:5671/"
  # Qui il nome è già completo: è un indirizzo pubblico del DNS di AWS, e vale
  # uguale in ogni namespace. La chiave resta perché KEDA la cerca con questo
  # nome.
  RABBITMQ_URL_FQDN: "amqps://{{ $pg.rabbitmqUser }}:{{ $pg.rabbitmqPassword }}@{{ .Values.aws.rabbitmqHost }}:5671/"
  # Niente S3_ACCESS_KEY né S3_SECRET_KEY: i servizi assumono un ruolo IAM
  # (serviceaccounts.yaml) e ricevono credenziali temporanee.
{{- end }}
