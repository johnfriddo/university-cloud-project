{{- /* Solo in locale: su AWS al suo posto c'è un servizio gestito, fuori dal cluster. */ -}}
{{- if eq .Values.platform "local" }}
# PostgreSQL: utenti, immagini, varianti e stato dei job.
#
# StatefulSet e non Deployment. La differenza che conta qui è
# l'aggiornamento: un Deployment, per sostituire un pod, ne accende uno nuovo
# *prima* di spegnere il vecchio, e il nuovo resterebbe bloccato in attesa di
# un disco che il vecchio non ha ancora rilasciato. Uno StatefulSet spegne
# prima e riaccende dopo, che è l'unico ordine sensato per un database.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "media-platform.labels" . | nindent 4 }}
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    {{- include "media-platform.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "media-platform.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "media-platform.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "media-platform.labels" . | nindent 8 }}
        {{- include "media-platform.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 8 }}
    spec:
      # Il tempo per chiudere le transazioni aperte e scrivere su disco prima
      # di essere terminato a forza.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          args:
            - -c
            - shared_buffers={{ .Values.postgres.sharedBuffers }}
            - -c
            - max_connections={{ .Values.postgres.maxConnections }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # Le credenziali arrivano dal Secret una per una, e non con
            # envFrom: quel Secret contiene anche le password di Mongo, del
            # broker e dell'object storage, che a PostgreSQL non servono.
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_DB } }
            # Una sottocartella del disco e non la sua radice: l'immagine
            # rifiuta di inizializzare una cartella che contiene già qualcosa,
            # e un disco appena creato non è sempre vuoto.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          # pg_isready è il comando che PostgreSQL offre apposta: risponde
          # solo quando il database accetta davvero connessioni, non quando il
          # processo esiste.
          #
          # Passa da una shell perché il nome dell'utente sta in una variabile
          # d'ambiente, e le sonde exec ricevono il comando così com'è scritto:
          # non sostituiscono nessuna variabile per conto loro.
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}

{{- end }}
