# Un'identità per ciascuno dei tre servizi Python.
#
# In locale non cambia niente: servono solo a dare un nome a chi gira. Su AWS
# sono il punto in cui un pod diventa qualcuno per IAM: l'annotazione dice
# quale ruolo il pod può assumere, e il ruolo dice cosa può fare. Il worker
# può leggere gli originali e scrivere le varianti, non cancellare; il
# notification-service può solo pubblicare su SNS. Le regole stanno in
# deploy/terraform/aws/infra/irsa.tf.
{{- $roles := dict
    "api-service" .Values.aws.roles.apiService
    "worker-service" .Values.aws.roles.workerService
    "notification-service" .Values.aws.roles.notificationService }}
{{- range $name := list "api-service" "worker-service" "notification-service" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "media-platform.labels" $ | nindent 4 }}
  {{- with get $roles $name }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . | quote }}
  {{- end }}
{{- end }}
