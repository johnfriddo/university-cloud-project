# Configurazione di Ansible per il cluster locale.
#
# Ansible legge questo file quando lo si lancia da questa cartella, e i
# percorsi qui sotto sono relativi a essa: per questo i comandi della Fase 6
# si danno sempre da `deploy/ansible/`.

[defaults]
# L'inventario è uno script, non un elenco: gli indirizzi delle macchine li
# assegna Multipass e cambiano a ogni ricreazione.
inventory = inventory/multipass.py

remote_user = ubuntu
private_key_file = ~/.ssh/media-platform

# Risultati su più righe invece che tutti su una: con tre macchine l'uscita
# resta corta e diventa leggibile.
#
# Non `stdout_callback = yaml`, che era la vecchia strada: quel plugin è stato
# rimosso da community.general 12, ed è diventato questa opzione.
result_format = yaml

# Ansible esegue moduli Python dentro la macchina remota. Senza questa riga
# avvisa a ogni task di aver scelto l'interprete da solo — cosa che va
# benissimo su un'immagine Ubuntu standard.
interpreter_python = auto_silent

# Niente file .retry sparsi nella repo: l'informazione è già nell'uscita.
retry_files_enabled = False

# I dati raccolti dalle macchine si leggono solo come ansible_facts['nome'],
# non come variabili sciolte ansible_nome.
#
# È il comportamento che diventerà l'unico da ansible-core 2.24: adottarlo
# adesso costa una parentesi in più e evita di riscrivere i playbook più
# avanti. Attenzione a non confonderli con ansible_host, che non è un dato
# raccolto ma una variabile dell'inventario e resta com'è.
inject_facts_as_vars = False

# Conserva i fatti raccolti fra un playbook e l'altro, per due ore. Raccogliere
# i fatti costa una connessione per macchina, e i playbook della Fase 6 si
# lanciano spesso di fila.
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible-media-platform-facts
fact_caching_timeout = 7200

[ssh_connection]
# La stessa chiave e lo stesso elenco di host conosciuti che usa
# deploy/cluster/cluster.sh: le macchine nuove riusano gli indirizzi delle
# vecchie con chiavi diverse, e un elenco dedicato al progetto evita di
# sporcare quello personale con voci che cambiano di continuo.
ssh_args = -o UserKnownHostsFile=~/.ssh/media-platform_known_hosts -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=15

# Un solo collegamento SSH per task invece di due. Su tre macchine virtuali
# che girano sullo stesso portatile la differenza si sente.
pipelining = True
